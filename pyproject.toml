[project]
name = "cogs-118d-final-project"
version = "0.1.0"
description = "Seeded trial generation for the reflected-maze pilot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
]
mutation = [
    "mutmut>=3.8,<4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.mutmut]
source_paths = ["maze.py", "maze_trials.py", "maze_viz.py"]
also_copy = [
    "main.py",
    "maze_viz.html",
    "maze_viz.js",
    "pilot_play.py",
    "pilot_play.html",
    "pilot_play.js",
]

