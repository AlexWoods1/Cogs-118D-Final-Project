<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reflected maze preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #1b2d3a;
      background: #f3f6f7;
      --secondary: #506474;
      --border: #ccd8de;
      --learned: #007e70;
      --shortcut: #7a3fa5;
      --beacon: #f59e0b;
      --symbol-circle: #0f766e;
      --symbol-diamond: #c2410c;
      --fog: #243749;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1160px; margin: auto; padding: clamp(18px, 4vw, 48px); }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 6px; font-size: clamp(1.8rem, 4vw, 2.65rem); letter-spacing: -.035em; }
    h2 { margin: 0; font-size: 1.12rem; }
    p { margin: 0; }
    #session, #trial-summary, .panel-caption, .legend { color: var(--secondary); }
    .controls {
      display: grid;
      grid-template-columns: minmax(145px, 1fr) minmax(0, 3fr);
      gap: 12px 16px;
      margin-bottom: 18px;
      padding: 16px;
      background: #e6eef1;
      border-radius: 12px;
    }
    label { display: grid; gap: 6px; font-size: .85rem; font-weight: 650; min-width: 0; }
    select {
      width: 100%;
      min-height: 44px;
      padding: 8px;
      font: inherit;
      font-size: 1rem;
      font-weight: 400;
      color: inherit;
      background: white;
      border: 1px solid #879eaa;
      border-radius: 6px;
    }
    #trial-summary { font-size: .9rem; margin-bottom: 18px; }
    .panels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure {
      margin: 0;
      padding: clamp(12px, 2vw, 20px);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
    }
    .panel-caption { margin-top: 4px; font-size: .875rem; }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 13 / 9;
      margin-top: 14px;
      border-radius: 8px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
      font-size: .85rem;
    }
    .legend li { display: inline-flex; align-items: center; gap: 6px; }
    .mark { display: inline-block; width: 16px; height: 0; border-top: 3px solid; }
    .mark.fog { height: 10px; border: 0; border-radius: 2px; background: var(--fog); }
    .mark.beacon {
      width: 14px;
      height: 14px;
      border: 0;
      background: var(--beacon);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
    .legend-icon {
      width: 18px;
      height: 18px;
      object-fit: contain;
      vertical-align: middle;
    }
    .mark.learned { border-color: var(--learned); }
    .mark.shortcut { border-color: var(--shortcut); border-top-style: dashed; }
    .mark.junction { width: 11px; height: 11px; border: 2px solid; border-radius: 50%; }
    @media (max-width: 760px) { .panels { grid-template-columns: 1fr; } }
    @media (max-width: 530px) { .controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Reflected maze preview</h1>
      <p id="session"></p>
    </header>
    <div class="controls">
      <label>Phase
        <select id="phase">
          <option value="test">Test blocks</option>
          <option value="pilot">Pilot probes</option>
        </select>
      </label>
      <label>Trial <select id="trial"></select></label>
    </div>
    <p id="trial-summary" role="status"></p>
    <div class="panels">
      <figure>
        <figcaption>
          <h2>Participant view</h2>
          <p class="panel-caption">Initial visibility at the start of the trial</p>
        </figcaption>
        <canvas id="participant" role="img"></canvas>
        <ul class="legend">
          <li><img class="legend-icon" id="symbol-mark" src="../media/landmark-circle.svg" alt=""> Orientation symbol</li>
          <li><img class="legend-icon" src="../media/landmark-beacon.svg" alt=""> Beacon</li>
          <li><span aria-hidden="true" class="mark fog"></span> Fog</li>
        </ul>
      </figure>
      <figure>
        <figcaption>
          <h2>Full layout</h2>
          <p id="savings" class="panel-caption"></p>
        </figcaption>
        <canvas id="full" role="img"></canvas>
        <ul class="legend">
          <li><span aria-hidden="true" class="mark learned"></span> <span id="learned-length"></span></li>
          <li><span aria-hidden="true" class="mark shortcut"></span> <span id="shortcut-length"></span></li>
          <li><span aria-hidden="true" class="mark junction"></span> Later junction</li>
        </ul>
      </figure>
    </div>
  </main>
  <script type="application/json" id="data"><!-- TRIAL_DATA --></script>
  <script><!-- PREVIEW_SCRIPT --></script>
</body>
</html>
